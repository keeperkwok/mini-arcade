<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>推箱子 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 560px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">📦</a>
    <div class="title">
      <h1>推箱子</h1>
      <p class="sub">TUI XIANGZI · 只能推不能拉，也别把自己堵死</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="stack">小仓库</button>
    <button data-diff="shift">中班</button>
    <button data-diff="hoard">爆仓</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几关</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">走了</span><span class="value" id="moves">0</span></div>
    <div class="chip"><span class="label">最优步</span><span class="value good" id="par">0</span></div>
    <div class="chip"><span class="label">加班额度</span><span class="value warn" id="lives">3</span></div>
    <div class="chip"><span class="label">分数</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="sb-room" id="room" aria-label="仓库地面"></div>
      <p class="sb-msg" id="msg">把每个 📦 推上 ● 地台</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnUndo" title="撤销一步 (Z)">↩<span>撤销</span><b id="undoN">0</b></button>
    <button class="tool" id="btnHint" title="看最优一步 (H)">💡<span>提示</span><b id="hintN">0</b></button>
    <button class="tool" id="btnReset" title="回到本关开局 (R)">🧹<span>重置</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <nav class="sb-pad" id="pad" aria-label="方向键">
    <button class="sb-up" data-mv="0" title="上">▲</button>
    <button class="sb-left" data-mv="3" title="左">◀</button>
    <button class="sb-right" data-mv="1" title="右">▶</button>
    <button class="sb-down" data-mv="2" title="下">▼</button>
  </nav>

  <footer class="tips">
    <p><b>箱子只能推、不能拉，也不能一次推两个</b>——把箱子顶进墙角就永远拿不出来了。地面上的 <b>●</b> 是卸货位，全部占满这关就过</p>
    <p><kbd>← ↑ → ↓</kbd> / <kbd>WASD</kbd> 走一步 · <kbd>点地面</kbd> 朝那个方向走 · <kbd>Z</kbd> 撤销 · <kbd>R</kbd> 重置本关 · <kbd>H</kbd> 提示 · <kbd>T</kbd> 战绩 —— 步数超过「最优 + 富余」要扣一次加班额度</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
