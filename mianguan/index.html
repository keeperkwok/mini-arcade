<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>面馆高峰期 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 640px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🍜</a>
    <div class="title">
      <h1>面馆高峰期</h1>
      <p class="sub">MIAN GUAN · 一口锅同时只能煮一份面</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="simmer">慢火</button>
    <button data-diff="noon">午市</button>
    <button data-diff="rush">高峰期</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">时段</span><span class="value info" id="lv">开门</span></div>
    <div class="chip"><span class="label">营业</span><span class="value" id="clock">0:00</span></div>
    <div class="chip"><span class="label">信誉</span><span class="value warn" id="rep">90</span></div>
    <div class="chip"><span class="label">出餐</span><span class="value good" id="served">0</span></div>
    <div class="chip"><span class="label">连击</span><span class="value" id="combo">×1.0</span></div>
    <div class="chip"><span class="label">营业额</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="mg-shop" id="shop" aria-label="面馆">
        <div class="mg-sec"><h2 class="mg-h">🧾 点单台</h2><div class="mg-orders" id="orders"></div></div>
        <div class="mg-sec"><h2 class="mg-h">🔥 灶上</h2><div class="mg-slots" id="pots"></div></div>
        <div class="mg-sec"><h2 class="mg-h">🥘 炒锅</h2><div class="mg-slots" id="woks"></div></div>
        <div class="mg-sec"><h2 class="mg-h">🛎️ 出餐台</h2><div class="mg-slots mg-counter" id="counter"></div></div>
      </div>
      <p class="mg-msg" id="msg">点卡片上的按钮做事：下锅 → 加浇头 → 上桌</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnPause" title="暂停 / 继续 (空格)">⏸<span>暂停</span></button>
    <button class="tool" id="btnTea" title="给等最久的客人送杯茶 (Q)">🍵<span>送茶</span><b id="teaN">1</b></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>一份面要过三道手</b>：🔥 下锅煮熟 → 🥘 炒浇头 → 🛎️ 端上桌。锅被占着别人就没法煮，<b>煮好不去加浇头会坨</b>，坨了只能倒掉</p>
    <p><kbd>点卡片</kbd> 做下一步 · <kbd>1-7</kbd> 快捷操作 · <kbd>Q</kbd> 送茶续耐心 · <kbd>空格</kbd> 暂停 · <kbd>T</kbd> 战绩 —— 信誉扣光就关张</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
