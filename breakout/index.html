<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打砖块 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 560px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🧱</a>
    <div class="title">
      <h1>打砖块</h1>
      <p class="sub">DA ZHUAN KUAI · 球打在挡板的哪一段，就往哪边飞</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="casual">松一松</button>
    <button data-diff="arcade">街机厅</button>
    <button data-diff="insane">硬核</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几关</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">砖块</span><span class="value" id="bricks">0</span></div>
    <div class="chip"><span class="label">连击</span><span class="value good" id="chain">0</span></div>
    <div class="chip"><span class="label">生命</span><span class="value warn" id="lives">3</span></div>
    <div class="chip"><span class="label">分数</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="打砖块"></canvas>
      <p class="bo-msg" id="msg">移动挡板，空格 / 点一下把球弹出去</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnPause" title="暂停 / 继续 (空格)">⏸<span>暂停</span></button>
    <button class="tool" id="btnLaunch" title="发球 (空格 / 点画面)">🎯<span>发球</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>挡板的正中把球直直顶回去，越靠边顶得越斜</b>——想连续拆同一排就得站准位置。<b>不碰挡板直接连撞的砖块有连击加分</b>，一挨挡板就清零；
    打碎的砖偶尔掉下道具：<b>⬌ 扩板 · ✚ 双球 · ◐ 缓速</b>，用挡板接住才生效</p>
    <p><kbd>← →</kbd> / <kbd>A D</kbd> 或 <kbd>拖动</kbd> 移动 · <kbd>空格</kbd> 发球 / 暂停 · <kbd>T</kbd> 战绩 · <kbd>M</kbd> 静音 —— 球掉出底部扣一条命，命没了这局就结束</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
