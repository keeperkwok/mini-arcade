<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>虫食算 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐛</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 520px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🐛</a>
    <div class="title">
      <h1>虫食算</h1>
      <p class="sub">CHONG SHI SUAN · 竖式被蛀掉了几个数</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="snack">当点心</button>
    <button data-diff="meal">正餐</button>
    <button data-diff="feast">盛宴</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几题</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">还差几格</span><span class="value" id="gap">0</span></div>
    <div class="chip"><span class="label">虫牙</span><span class="value bad" id="bites">2</span></div>
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="cs-form" id="form" aria-label="竖式"></div>
      <p class="cs-msg" id="msg">挑一个空格，把数字填回去</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="cs-pad" id="pad" aria-label="数字键盘"></section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnClue" title="放大镜 (B)">🔍<span>放大镜</span><b id="clueN">3</b></button>
    <button class="tool" id="btnSwap" title="换一题 (R)">🍀<span>换一题</span><b id="swapN">1</b></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>填错不判死</b>，但虫会当场再咬掉一个你原本看得见的数字 —— 能看见的只会越来越少 · 首位不给 0，<b>进位借位也算账</b></p>
    <p><kbd>0-9</kbd> 填当前格 · <kbd>← →</kbd> 换格 · <kbd>⌫</kbd> 擦掉 · <kbd>B</kbd> 放大镜 · <kbd>R</kbd> 换一题 · <kbd>T</kbd> 战绩 · <kbd>N</kbd> 重开</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
