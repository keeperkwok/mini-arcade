<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拧螺丝 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🔩</a>
    <div class="title">
      <h1>拧螺丝</h1>
      <p class="sub">SCREW OUT · 拆板排序</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnRestart" class="icon-btn" title="重玩本关 (R)" aria-label="重玩本关">↻</button>
    </div>
  </header>

  <section class="stats">
    <div class="chip"><span class="label">关卡</span><span class="value" id="level">1</span></div>
    <div class="chip"><span class="label">剩余螺丝</span><span class="value" id="left">0</span></div>
    <div class="chip"><span class="label">得分</span><span class="value" id="score">0</span></div>
    <div class="chip"><span class="label">最远关卡</span><span class="value" id="best">1</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap" id="boardWrap">
      <canvas id="screw-canvas" aria-label="螺丝板与收纳槽"></canvas>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools">
    <button class="tool" id="btnUndo">↶<span>撤销 <b id="undoN">3</b></span></button>
    <button class="tool" id="btnHint">💡<span>提示 <b id="hintN">3</b></span></button>
    <button class="tool" id="btnSkip">⏭<span>跳过本关</span></button>
  </section>

  <footer class="tips">
    <p>🔩 只有<b>没被上层板压住</b>的螺丝能拧下 · 拧下的螺丝进入下方收纳槽</p>
    <p>🎯 同色集满 3 颗自动销毁;收纳槽 7 格塞满就失败 · <kbd>U</kbd> 撤销 <kbd>H</kbd> 提示 <kbd>R</kbd> 重玩</p>
  </footer>
</main>

<script src="game.js"></script>
</body>
</html>
