<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>网页小游戏 · Mini Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app">
  <header class="hero">
    <div class="logo" aria-hidden="true">🕹️</div>
    <h1>网页小游戏</h1>
    <p class="sub">MINI ARCADE · 纯前端 · 即开即玩</p>
  </header>

  <section id="hud" class="hud" aria-label="本机进度"></section>

  <nav id="filters" class="filters" aria-label="筛选游戏"></nav>

  <section id="games" class="games" aria-label="游戏列表"></section>

  <p id="empty" class="empty" hidden>这个分类下还没有游戏,换个筛选看看。</p>

  <footer class="foot">
    <p>无需安装 · 双击即玩 · 支持键盘与触屏</p>
  </footer>
</main>

<script src="home.js"></script>
</body>
</html>
