<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>兵蜂大作战 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🐝</a>
    <div class="title">
      <h1>兵蜂大作战</h1>
      <p class="sub">TWINBEE · 云端射击</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnPause" class="icon-btn" title="暂停 / 继续" aria-label="暂停或继续">⏸</button>
    </div>
  </header>

  <section class="stats">
    <div class="chip"><span class="label">得分</span><span class="value" id="score">0</span></div>
    <div class="chip"><span class="label">最高纪录</span><span class="value" id="best">0</span></div>
    <div class="chip"><span class="label">关卡</span><span class="value" id="stage">1</span></div>
    <div class="chip"><span class="label">生命</span><span class="value" id="lives">3</span></div>
  </section>

  <section class="board-wrap" id="boardWrap">
    <canvas id="board"></canvas>
  </section>

  <footer class="tips">
    <p>⌨️ 方向键 / WASD 移动 · <kbd>空格</kbd> 射击(按住连发) · <kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音</p>
    <p>🔔 打云朵掉铃铛，<b class="gold">射击铃铛可变色</b>：黄=分数 蓝=散射 红=激光 白=护盾 · ⭐ 星星加速</p>
    <p>📱 触屏：按住拖动即移动并自动射击</p>
  </footer>
</main>

<script src="core.js"></script>
<script src="battle.js"></script>
<script src="render.js"></script>
</body>
</html>
