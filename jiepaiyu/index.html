<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>节拍雨 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 500px; --board-ratio: 460 / 620">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🎵</a>
    <div class="title">
      <h1>节拍雨</h1>
      <p class="sub">BEAT RAIN · 四键音游</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重新开始" aria-label="重新开始">↻</button>
    </div>
  </header>

  <section class="diff" id="songs" aria-label="选择曲目"></section>

  <section class="stats">
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
    <div class="chip"><span class="label">连击</span><span class="value info" id="combo">0</span></div>
    <div class="chip"><span class="label">准度</span><span class="value" id="acc">100%</span></div>
    <div class="chip"><span class="label">生命</span><span class="value bad" id="hp">100</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="节拍雨谱面"></canvas>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnAuto" title="自动演奏：跟着谱面看一遍，不计纪录">🎧<span>演示 <b id="autoState">关</b></span></button>
    <button class="tool" id="btnSlow" title="慢速 0.75 倍，练习用"><🐢<span>慢速 <b id="slowState">关</b></span></button>
    <button class="tool" id="btnPause" title="暂停 / 继续 (P)">⏸<span id="pauseLabel">暂停</span></button>
  </section>

  <p class="now" id="now">选一首开演</p>

  <footer class="tips">
    <p>🎹 音符就是主旋律本身：<b>落到判定线上按 D F J K</b>（触屏点下面四块琴键）你就把这段旋律补全了</p>
    <p>🔥 连击攒满进入 <b>FEVER</b>，分数翻倍；漏一个音旋律就哑一拍，还会扣血，血空了演出直接中断</p>
    <p>三首曲子是三档强度（96 / 124 / 152 BPM），<kbd>P</kbd>暂停 <kbd>1-3</kbd>切歌 <kbd>空格</kbd>开演/重来 · 谱面由代码实时生成，伴奏也是现场合成的</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
