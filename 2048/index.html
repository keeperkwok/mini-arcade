<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🔢</a>
    <div class="title">
      <h1>2048</h1>
      <p class="sub">2048 · 数字合并</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="新游戏" aria-label="新游戏">↻</button>
    </div>
  </header>

  <section class="stats">
    <div class="chip"><span class="label">得分</span><span class="value" id="score">0</span></div>
    <div class="chip"><span class="label">最高纪录</span><span class="value" id="best">0</span></div>
    <div class="chip"><span class="label">最大方块</span><span class="value" id="maxTile">0</span></div>
  </section>

  <section class="board-wrap">
    <div class="board">
      <div class="grid-bg" id="gridBg"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <footer class="tips">
    <p>⌨️ 方向键 / WASD 滑动合并 · 📱 手机直接在棋盘上滑动</p>
    <p>合并相同数字,合成 <b class="gold">2048</b> 即获胜,之后还能继续冲击更高分!</p>
  </footer>
</main>

<script src="game.js"></script>
</body>
</html>
