<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>连连看 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 660px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🔗</a>
    <div class="title">
      <h1>连连看</h1>
      <p class="sub">LIAN LIAN KAN · 拐两个弯以内就连得上</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="quick">眼疾</button>
    <button data-diff="sharp">手快</button>
    <button data-diff="master">老手</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几盘</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">剩余</span><span class="value warn" id="clock">0:00</span></div>
    <div class="chip"><span class="label">还剩对子</span><span class="value" id="left">0</span></div>
    <div class="chip"><span class="label">连击</span><span class="value good" id="combo">—</span></div>
    <div class="chip"><span class="label">分数</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="lk-board" id="board" aria-label="牌面"></div>
      <p class="lk-msg" id="msg">点两张一样的牌，通路拐弯不超过两次就连走</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnHint" title="点一对能连的（扣 3 秒）">💡<span>提示</span><b id="hintN">0</b></button>
    <button class="tool" id="btnMix" title="打乱重摆（扣 5 秒）">🌀<span>洗牌</span><b id="mixN">0</b></button>
    <button class="tool" id="btnPause" title="暂停 / 继续 (空格)">⏸<span>暂停</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>通路只能穿过空位和棋盘外圈</b>，直着走、拐一个弯、拐两个弯都算连得上；中间隔着别的牌就断了。<b>两张牌之间不用贴在一起</b>，能绕出去再绕回来就行</p>
    <p><kbd>点牌</kbd> 选两张 · <kbd>空格</kbd> 暂停 · <kbd>H</kbd> 提示（扣 3 秒） · <kbd>S</kbd> 洗牌（扣 5 秒） · <kbd>T</kbd> 战绩 —— 2.5 秒内接着消就能叠连击，时间清零就散场；没有牌能连了会自动洗牌，次数用完就收摊</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
