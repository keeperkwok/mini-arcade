<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>跳一跳 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦘</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b4"></i></div>

<main class="app" style="--app-width: 560px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🦘</a>
    <div class="title">
      <h1>跳一跳</h1>
      <p class="sub">TIAO YI TIAO · 按住蓄力，松手落台</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="easy">慢慢跳</button>
    <button data-diff="norm">标准手感</button>
    <button data-diff="hard">极限距离</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几关</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">连击</span><span class="value good" id="combo">—</span></div>
    <div class="chip"><span class="label">还能站</span><span class="value warn" id="idle">6.0s</span></div>
    <div class="chip"><span class="label">跳数</span><span class="value" id="jumps">0</span></div>
    <div class="chip"><span class="label">分数</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="跳一跳场地"></canvas>
      <div class="ty-bar"><i class="ty-fill" id="bar"></i><span class="ty-bar-t" id="barT">力度 0%</span></div>
      <p class="ty-msg" id="msg">按住不动蓄力，松手起跳。站着超过 6 秒不跳就算输。</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnJump" title="按住蓄力（空格）">🦘<span>按住跳</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>蓄力越久跳得越远</b>，落点距离是蓄力时长的纯函数 —— 台子越窄越远越吃手感。
    <b>落在正中（白心）算完美</b>，连击越高分涨得越凶；踩到边上算过，跳过头或够不着就直接掉下去</p>
    <p><kbd>按住画面 / 空格</kbd> 蓄力，<kbd>松手</kbd> 起跳 · <kbd>T</kbd> 战绩 · <kbd>N</kbd> 重开 · <kbd>M</kbd> 静音 —— 站着不动超过几秒也算输</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
