<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>算独 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➗</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 520px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">➗</a>
    <div class="title">
      <h1>算独</h1>
      <p class="sub">KENKEN · 四则运算填数</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="生成新题" aria-label="生成新题">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="easy">四宫</button>
    <button data-diff="medium">五宫</button>
    <button data-diff="hard">六宫</button>
    <button data-diff="expert">六宫·难</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">用时</span><span class="value" id="time">0:00</span></div>
    <div class="chip"><span class="label">错误</span><span class="value" id="mistakes">0</span></div>
    <div class="chip"><span class="label">最佳用时</span><span class="value info" id="best">--</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="board" id="board" aria-label="算独盘面"></div>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="pad" aria-label="数字键盘">
    <div class="digits" id="digits"></div>
    <div class="tools">
      <button class="tool" id="btnUndo" title="撤销 (U)">↶<span>撤销</span></button>
      <button class="tool" id="btnNote" title="笔记模式 (N)">✎<span>笔记</span></button>
      <button class="tool" id="btnErase" title="擦除 (Delete)">⌫<span>擦除</span></button>
      <button class="tool" id="btnHint" title="提示 (H)">💡<span>提示</span></button>
    </div>
  </section>

  <footer class="tips">
    <p> 每行每列 1~N 不重复；每个粗线笼子左上角是 <b>目标数+运算</b>，笼内数字按该运算能得到它</p>
    <p>🖱️ 点格子 → 点数字 · <kbd>N</kbd> 笔记 · <kbd>U</kbd> 撤销 · <kbd>H</kbd> 提示 · 单格笼 <kbd>=</kbd> 就是已知数</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
