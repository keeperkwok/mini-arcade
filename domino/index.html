<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>多米诺 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🁡</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 660px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🁡</a>
    <div class="title">
      <h1>多米诺</h1>
      <p class="sub">DUO MI NO · 一张推一张</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnStats" class="icon-btn" title="本机战绩 (T)" aria-label="本机战绩">📊</button>
      <button id="btnNew" class="icon-btn" title="从第一关重来 (N)" aria-label="从第一关重来">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="骨牌规格">
    <button data-diff="kid">儿童牌 50</button>
    <button data-diff="std">标准牌 40</button>
    <button data-diff="pro">竞技牌 32</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">关卡</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">已摆</span><span class="value" id="used">1</span></div>
    <div class="chip"><span class="label">牌数上限</span><span class="value warn" id="cap">20</span></div>
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
    <div class="chip"><span class="label">能倒</span><span class="value" id="fell">1</span></div>
    <div class="chip"><span class="label">最佳分</span><span class="value" id="best">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="骨牌桌面"></canvas>
      <p class="dm-state" id="state">摆牌中</p>
      <p class="dm-msg" id="msg">按住拖一下就能放一张牌：拖动方向就是它倒下的方向</p>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools dm-tools" aria-label="操作">
    <button class="tool" id="btnFall" title="推倒第一张 (Enter)">👆<span>推倒</span></button>
    <button class="tool" id="btnUndo" title="撤销上一张 (Z)">↩️<span>撤销</span></button>
    <button class="tool" id="btnClear" title="拆掉笔架附近的牌 (X)">🧹<span>拆牌</span></button>
    <button class="tool" id="btnHint" title="参考摆法 (H)">👀<span>提示</span><b id="hintN">2</b></button>
  </section>

  <footer class="tips">
    <p><b>骨牌倒下的距离就是它的长度</b>：摆太密没劲，摆太疏够不着；转弯要顺着来，一张牌也能同时拍倒两张</p>
    <p><kbd>拖动/点击</kbd> 放牌 · <kbd>←↑→↓</kbd> 移动笔架 · <kbd>空格</kbd> 放牌 · <kbd>,</kbd><kbd>.</kbd> 转方向 · <kbd>Enter</kbd> 推倒 · <kbd>X</kbd> 拆 · <kbd>Z</kbd> 撤销 · <kbd>H</kbd> 提示 · <kbd>R</kbd> 本关重来 · <kbd>T</kbd> 战绩 · <kbd>N</kbd> 重开 · <kbd>M</kbd> 静音</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
