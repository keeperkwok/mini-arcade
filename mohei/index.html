<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>摸黑 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 620px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🕵️</a>
    <div class="title">
      <h1>摸黑</h1>
      <p class="sub">MO HEI · 一步一等，别走进光里</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="sneak">潜行</button>
    <button data-diff="dark">摸黑</button>
    <button data-diff="ghost">鬼影</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几关</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">回合</span><span class="value" id="turn">0</span></div>
    <div class="chip"><span class="label">警报</span><span class="value bad" id="alarm">2</span></div>
    <div class="chip"><span class="label">手里</span><span class="value warn" id="carry">空</span></div>
    <div class="chip"><span class="label">步数</span><span class="value" id="steps">0</span></div>
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" width="560" height="360" aria-label="牢房俯视图"></canvas>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnStone" title="装填石子 (Q)">🪨<span>装石子</span><b id="stoneN">3</b></button>
    <button class="tool" id="btnHint" title="看路线 (H)">👀<span>看路线</span><b id="hintN">2</b></button>
    <button class="tool" id="btnWait" title="原地等一回合 (.)">⏳<span>等一回合</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>你走一步，守卫才走一步</b>：他们按固定的换岗路线与朝向巡逻，光锥照到的格子站进去就被发现 · 被发现退回本关开头，警报耗尽就出局</p>
    <p><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 走一格 · 点相邻格也行，点自己脚下是等待 · <kbd>Q</kbd> 装石子后点远处：<b>守卫会去查探</b> · <kbd>H</kbd> 路线 · <kbd>R</kbd> 重来本关 · <kbd>T</kbd> 战绩</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
