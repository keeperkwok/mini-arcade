<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三校 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 540px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">✏️</a>
    <div class="title">
      <h1>三校</h1>
      <p class="sub">SAN JIAO · 把错别字圈出来</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="岗位选择">
    <button data-diff="easy">见习校对</button>
    <button data-diff="normal">正式校对</button>
    <button data-diff="hard">终审责编</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">稿费</span><span class="value good" id="coin">0</span></div>
    <div class="chip"><span class="label">已校段落</span><span class="value info" id="lv">0</span></div>
    <div class="chip"><span class="label">退稿机会</span><span class="value warn" id="life">3</span></div>
    <div class="chip"><span class="label">截稿倒计时</span><span class="value" id="clock">60</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap sj-wrap">
      <div class="sj-paper">
        <p class="sj-note" id="note">本段有 1 处错别字</p>
        <div class="sj-doc" id="doc" aria-label="稿件正文"></div>
        <p class="sj-fix" id="fixes"></p>
      </div>
      <div class="sj-bar"><i class="sj-bar-fill" id="bar"></i></div>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnAsk" title="请主编指一处（扣稿费）">👀<span>求助</span><b id="askCost">-60</b></button>
    <button class="tool" id="btnGive" title="交不了就认退稿">📤<span>退稿</span></button>
    <button class="tool" id="btnStats" title="本机累计 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p>点掉稿子里的<b>错别字</b>：圈对赚钱，圈错<b>扣稿费还扣时间</b>；把本段的错处全找出来就能进下一段</p>
    <p>时间到或主动退稿 = 主编替你改，消耗一次退稿机会 · <kbd>H</kbd> 求助 · <kbd>G</kbd> 退稿 · <kbd>N</kbd> 重开 · <kbd>M</kbd> 静音</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
