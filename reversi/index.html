<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黑白棋 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌓</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 520px; --board-ratio: 1 / 1">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🌓</a>
    <div class="title">
      <h1>黑白棋</h1>
      <p class="sub">OTHELLO · 夹击翻子</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重新开局" aria-label="重新开局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="对战方式">
    <button data-m="pvp">👥 双人</button>
    <button data-m="easy">🤖 新手</button>
    <button data-m="mid">🤖 棋友</button>
    <button data-m="hard">🤖 高手</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">回合</span><span class="value" id="turn">黑方</span></div>
    <div class="chip"><span class="label">黑 : 白</span><span class="value info" id="count">2 : 2</span></div>
    <div class="chip"><span class="label">战绩</span><span class="value warn" id="score">--</span></div>
  </section>

  <div class="bar" title="双方子力对比"><i class="blk" id="barBlk"></i><i class="wht" id="barWht"></i></div>

  <section class="board-outer">
    <div class="board-wrap"><canvas id="cv" aria-label="黑白棋盘"></canvas></div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnUndo" title="悔棋 (U)">↶<span>悔棋</span></button>
    <button class="tool" id="btnHint" title="提示这一步 (H)">💡<span>提示</span></button>
    <button class="tool" id="btnResign" title="认输 (R)">🏳<span>认输</span></button>
  </section>

  <footer class="tips">
    <p>落子必须<b>夹住</b>对方棋子（横竖斜任意方向），被夹住的一串当场翻色；无处可走就弃权</p>
    <p>🖱️ 悬停可预览会翻哪几颗 · <kbd>U</kbd> 悔棋 · <kbd>H</kbd> 提示 · <kbd>R</kbd> 认输（点两下）· 棋盘下满或双方都走不动时比子数</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
