<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中国象棋 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 520px; --board-ratio: 600 / 664">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🐉</a>
    <div class="title">
      <h1>中国象棋</h1>
      <p class="sub">XIANGQI · 楚河汉界</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重新开局" aria-label="重新开局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="对战方式">
    <button data-m="pvp">👥 双人</button>
    <button data-m="easy">🤖 新手</button>
    <button data-m="mid">🤖 棋友</button>
    <button data-m="hard">🤖 高手</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">回合</span><span class="value red" id="turn">红方</span></div>
    <div class="chip"><span class="label">着法</span><span class="value info" id="moves">0</span></div>
    <div class="chip"><span class="label">战绩</span><span class="value warn" id="score">--</span></div>
  </section>

  <div class="replay" id="replay" title="本局棋谱"><b>棋谱</b><span id="notat">尚未开局</span></div>

  <section class="board-outer">
    <div class="board-wrap"><canvas id="cv" aria-label="象棋棋盘"></canvas></div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnUndo" title="悔棋 (U)">↶<span>悔棋</span></button>
    <button class="tool" id="btnHint" title="提示这一步 (H)">💡<span>提示</span></button>
    <button class="tool" id="btnSide" title="人机模式换边重开">🔄<span>换边</span></button>
    <button class="tool" id="btnResign" title="认输 (R)">🏳<span>认输</span></button>
  </section>

  <footer class="tips">
    <p>点棋子看可走位置，再点目标落子；<b>马踩别腿、相塞田眼、炮隔子打、将帅不能照面</b>都按正规规则判定</p>
    <p><kbd>U</kbd> 悔棋 · <kbd>H</kbd> 提示 · <kbd>R</kbd> 认输（点两下确认）· <kbd>Esc</kbd> 取消选中 · 无子可走即负</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
