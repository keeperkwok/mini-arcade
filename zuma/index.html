<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>祖玛珠链 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 480px; --board-ratio: 460 / 640">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🐸</a>
    <div class="title">
      <h1>祖玛珠链</h1>
      <p class="sub">ZUMA · 轨道三消</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重新开始" aria-label="重新开始">↻</button>
    </div>
  </header>

  <section class="stats">
    <div class="chip"><span class="label">关卡</span><span class="value info" id="level">1</span></div>
    <div class="chip"><span class="label">台上珠子</span><span class="value" id="left">0</span></div>
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
    <div class="chip"><span class="label">最高分</span><span class="value warn" id="best">0</span></div>
  </section>

  <div class="dangerbar" title="珠链离洞口的距离">
    <i class="danger"><u id="danger"></u></i>
    <span class="dlabel" id="dlab">安全</span>
  </div>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="祖玛轨道"></canvas>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnSwap" title="交换嘴里和备用的珠子 (S)">⇄<span>换珠</span></button>
    <button class="tool" id="btnPause" title="暂停 / 继续 (P)">⏸<span>暂停</span></button>
    <button class="tool" id="btnHelp" title="玩法说明 (?)">❓<span>说明</span></button>
  </section>

  <footer class="tips">
    <p>🐸 青蛙在原地转脸：🖱️ 移动瞄准、点击吐珠 · <kbd>←</kbd><kbd>→</kbd> 微调 · <kbd>空格</kbd>吐珠 · <kbd>S</kbd> 换珠</p>
    <p>三颗同色相连就爆；<b>一次炸 4 颗以上会把整条链顶回去</b>，连锁消掉越多分越高，全消光才算过关</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
