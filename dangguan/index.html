<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一夫当关 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 500px; --board-ratio: 440 / 320">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🏰</a>
    <div class="title">
      <h1>一夫当关</h1>
      <p class="sub">MAZE TOWER · 改路塔防</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重新开始" aria-label="重新开始">↻</button>
    </div>
  </header>

  <section class="diff" id="modes" aria-label="选择难度"></section>

  <section class="stats">
    <div class="chip"><span class="label">金币</span><span class="value warn" id="gold">0</span></div>
    <div class="chip"><span class="label">砖块</span><span class="value" id="bricks">0</span></div>
    <div class="chip"><span class="label">城防</span><span class="value bad" id="lives">0</span></div>
    <div class="chip"><span class="label">波次</span><span class="value info" id="wave">1</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <canvas id="cv" aria-label="一夫当关战场"></canvas>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="build" id="build" aria-label="建造"></section>

  <section class="wavebar">
    <button class="primary" id="btnWave"> ▶ 开打第 1 波</button>
    <button class="ghost" id="btnSpeed">1×</button>
    <span class="route" id="route">路线 —</span>
  </section>

  <section class="panel" id="panel" hidden></section>

  <section class="legend" id="legend" aria-label="敌人图鉴"></section>

  <footer class="tips">
    <p>🧱 这一作的<b>塔和墙都是路障</b>：敌人永远走「当下最短的那条路」，你放下的每一格都会当场改写全场路线</p>
    <p>🐏 但<b>撞墙兵只走直线</b>、👻 <b>幽灵会飞</b>——把路堵成迷宫，这两种会专门治你；<b>路被彻底堵死时不放行</b></p>
    <p><kbd>1</kbd>连弩 <kbd>2</kbd>投石 <kbd>3</kbd>冰井 <kbd>4</kbd>砌墙 <kbd>Q</kbd>拆除 <kbd>空格</kbd>开下一波 <kbd>P</kbd>暂停 <kbd>S</kbd>加速 · 点已建的塔可升级或卖掉</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
