<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>移个车先 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 560px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🚗</a>
    <div class="title">
      <h1>移个车先</h1>
      <p class="sub">YI GE CHE XIAN · 只能沿着自己那一条道滑</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="crawl">慢慢挪</button>
    <button data-diff="jam">早高峰</button>
    <button data-diff="gridlock">大堵车</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几场</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">挪了几次</span><span class="value" id="used">0</span></div>
    <div class="chip"><span class="label">最少要挪</span><span class="value good" id="par">0</span></div>
    <div class="chip"><span class="label">分数</span><span class="value" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap">
      <div class="pk-lot" id="lot" aria-label="停车场">
        <div class="pk-cells" id="cells"></div>
        <div class="pk-cars" id="cars"></div>
        <div class="pk-exit" aria-hidden="true">🚪</div>
      </div>
      <p class="pk-msg" id="msg">点一辆车选中它，再点它能让开的位置</p>
      <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
    </div>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnUndo" title="撤销 (Z)">↩<span>撤销</span><b id="undoN">0</b></button>
    <button class="tool" id="btnHint" title="看提示 (H)">💡<span>提示</span><b id="hintN">2</b></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p><b>每辆车只能沿自己车头方向滑</b>，滑多远都算一次 · 红色那辆开到 🚪 就赢 —— 关卡是<b>从出口倒着推出来的</b>，所以一定有解</p>
    <p><kbd>点车</kbd> 选中 · <kbd>点空格</kbd> 滑过去 · <kbd>← ↑ → ↓</kbd> 微移 · <kbd>1-9</kbd> 换车 · <kbd>Z</kbd> 撤销 · <kbd>H</kbd> 提示 · <kbd>T</kbd> 战绩</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
