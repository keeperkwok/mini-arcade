<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>咬文嚼字 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app" style="--app-width: 560px">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🦷</a>
    <div class="title">
      <h1>咬文嚼字</h1>
      <p class="sub">YAO WEN JIAO ZI · 一句话读出几种意思</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnNew" class="icon-btn" title="重开一局" aria-label="重开一局">↻</button>
    </div>
  </header>

  <section class="diff" id="diff" aria-label="难度选择">
    <button data-diff="easy">先生带读</button>
    <button data-diff="normal">自己咬</button>
    <button data-diff="hard">刀刀见血</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">第几句</span><span class="value info" id="lv">1</span></div>
    <div class="chip"><span class="label">本句读法</span><span class="value" id="prog">0/2</span></div>
    <div class="chip"><span class="label">口粮</span><span class="value warn" id="bites">5</span></div>
    <div class="chip"><span class="label">分数</span><span class="value good" id="score">0</span></div>
  </section>

  <section class="board-outer">
    <div class="board-wrap yw-wrap">
      <p class="yw-src" id="src">断句救场</p>
      <div class="yw-line" id="line" aria-label="无标点的句子"></div>
      <div class="yw-marks" id="marks" aria-label="本句读法"></div>
      <p class="yw-msg" id="msg">在字与字的缝上点一下：再点换成顿号，第三次点开</p>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <section class="yw-go">
    <button class="primary yw-read" id="btnRead">这样读！<span>(Enter)</span></button>
  </section>

  <section class="tools" aria-label="操作">
    <button class="tool" id="btnHint" title="提示一处该断的地方 (H)">💡<span>咬一口</span><b id="hintN">3</b></button>
    <button class="tool" id="btnClear" title="擦掉所有断点 (C)">🧽<span>擦净</span></button>
    <button class="tool" id="btnStats" title="本机战绩 (T)">📊<span>战绩</span></button>
  </section>

  <footer class="tips">
    <p>一串没有标点的字，<b>刀落在哪儿，意思就是什么</b>：把这一句能读出的<b>每一种</b>断法全找出来才算过</p>
    <p>试读一次吃一口粮，读不通也吃 · <kbd>数字1-9</kbd> 切缝 · <kbd>Enter</kbd> 这样读 · <kbd>H</kbd> 提示 · <kbd>C</kbd> 擦净 · <kbd>M</kbd> 静音</p>
  </footer>
</main>

<script src="../shared/sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
