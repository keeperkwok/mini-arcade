<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>水果消消乐 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<main class="app">
  <header class="top">
    <a class="logo home" href="../index.html" title="返回主页" aria-label="返回主页">🍉</a>
    <div class="title">
      <h1>水果消消乐</h1>
      <p class="sub">FRUIT MATCH-3</p>
    </div>
    <div class="actions">
      <button id="btnSound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btnHint" class="icon-btn" title="提示一步 (H)" aria-label="提示">💡</button>
      <button id="btnNew" class="icon-btn" title="重玩本关 (N)" aria-label="重玩本关">↻</button>
    </div>
  </header>

  <section class="diff" id="mode" aria-label="难度选择">
    <button data-types="5">轻松 5 种水果</button>
    <button data-types="6">标准 6 种水果</button>
    <button data-types="7">烧脑 7 种水果</button>
  </section>

  <section class="stats">
    <div class="chip"><span class="label">得分</span><span class="value" id="score">0</span></div>
    <div class="chip"><span class="label">关卡</span><span class="value" id="level">1</span></div>
    <div class="chip"><span class="label">剩余步数</span><span class="value" id="moves">20</span></div>
  </section>

  <section class="tray" id="tray" aria-label="关卡目标"></section>

  <section class="board-outer">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"><div class="layer" id="layer"></div></div>
    </div>
    <div id="overlay" class="overlay"><div id="overlayContent" class="overlay-content"></div></div>
  </section>

  <footer class="tips">
    <p>🖱️ 拖动交换相邻水果 · 三连即可消除 · <b class="gold">4 连</b>出十字宝石，<b class="gold">5 连</b>出炸弹宝石，可连锁引爆</p>
    <p>📱 手机：滑动或先后点两个相邻水果 · 在步数用完前完成目标即可过关 · <kbd>H</kbd> 提示 · <kbd>N</kbd> 重玩</p>
  </footer>
</main>

<script src="game.js"></script>
</body>
</html>
